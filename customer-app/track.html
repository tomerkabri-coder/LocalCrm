<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב קריאה - Garage CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
        #map { height: 300px; width: 100%; border-radius: 12px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-md mx-auto p-4">
        <header class="text-center py-6">
            <h1 class="text-2xl font-bold text-slate-800">מעקב קריאה חיה</h1>
            <p id="customerNameDisplay" class="text-slate-600 font-medium"></p>
            <p id="callIdDisplay" class="text-slate-500 text-sm">קריאה #----</p>
        </header>

        <!-- Status Card -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
            <div class="flex items-center space-x-4 space-x-reverse mb-6">
                <div id="statusIcon" class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-2xl">
                    ⏳
                </div>
                <div>
                    <div id="statusText" class="text-xl font-bold">מעבד נתונים...</div>
                    <div id="etaText" class="text-sm text-slate-500">מחשב זמן הגעה משוער...</div>
                </div>
            </div>

            <!-- Progress Tracker -->
            <div class="relative flex justify-between">
                <div class="absolute top-1/2 left-0 w-full h-1 bg-slate-100 -translate-y-1/2 z-0"></div>
                <div id="progressBar" class="absolute top-1/2 left-0 w-0 h-1 bg-blue-500 -translate-y-1/2 z-0 transition-all duration-500"></div>
                
                <div class="z-10 bg-white p-1"><div id="step1" class="w-3 h-3 rounded-full bg-slate-300"></div></div>
                <div class="z-10 bg-white p-1"><div id="step2" class="w-3 h-3 rounded-full bg-slate-300"></div></div>
                <div class="z-10 bg-white p-1"><div id="step3" class="w-3 h-3 rounded-full bg-slate-300"></div></div>
                <div class="z-10 bg-white p-1"><div id="step4" class="w-3 h-3 rounded-full bg-slate-300"></div></div>
            </div>
            <div class="flex justify-between text-[10px] text-slate-400 mt-2">
                <span>התקבלה</span>
                <span>בדרך</span>
                <span>במקום</span>
                <span>הושלמה</span>
            </div>
        </div>

        <!-- Map Section -->
        <div id="mapContainer" class="bg-white rounded-2xl shadow-lg p-2 mb-6 hidden">
            <div id="map"></div>
            <div class="p-3 text-center">
                <p id="techInfo" class="text-sm font-bold text-slate-700"></p>
            </div>
        </div>

        <!-- Details Card -->
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <h3 class="font-bold mb-4 border-b pb-2">פרטי הקריאה</h3>
            <div class="space-y-3 text-sm">
                <div class="flex justify-between">
                    <span class="text-slate-500">סוג תקלה:</span>
                    <span id="detailIssue" class="font-medium">-</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-500">כתובת:</span>
                    <span id="detailAddress" class="font-medium">-</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-500">מועד לביקור:</span>
                    <span id="detailScheduled" class="font-medium text-blue-600">-</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-500">דחיפות:</span>
                    <span id="detailUrgency" class="font-medium">-</span>
                </div>
            </div>
        </div>
        
        <footer class="text-center mt-8 text-slate-400 text-xs">
            Garage CRM POC &copy; 2024
        </footer>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api/action";
        const urlParams = new URLSearchParams(window.location.search);
        const callId = urlParams.get('id');
        
        let map, techMarker, userMarker;

        if (!callId) {
            document.body.innerHTML = '<div class="p-10 text-center">שגיאה: מזהה קריאה חסר</div>';
        } else {
            document.getElementById('callIdDisplay').textContent = `קריאה #${callId}`;
            initTracking();
        }

        async function initTracking() {
            await updateData();
            setInterval(updateData, 30000); // Update every 30s
        }

        async function updateData() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'GET_CALL_DETAILS', call_id: callId })
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    renderTracking(result.call, result.technician, result.customer);
                }
            } catch (e) {
                console.error("Tracking update failed", e);
            }
        }

        function translateDoorClass(cls) {
            const map = {
                'Private': 'פרטי',
                'Commercial': 'מסחרי'
            };
            return map[cls] || cls;
        }

        function translateDoorType(type) {
            const map = {
                'Roll-up': 'רול אפ',
                'Overhead': 'אובר הד',
                'Gate': 'שער'
            };
            return map[type] || type;
        }

        function renderTracking(call, tech, customer) {
            // Update Customer Name
            if (customer) {
                document.getElementById('customerNameDisplay').textContent = `שלום, ${customer.first_name} ${customer.last_name}`;
            }

            // Update Text & Details
            document.getElementById('statusText').textContent = translateStatus(call.status);
            document.getElementById('detailIssue').textContent = `${translateDoorClass(call.door_class)} - ${translateDoorType(call.door_type)}`;
            document.getElementById('detailAddress').textContent = call.address;
            document.getElementById('detailScheduled').textContent = call.scheduled_time || 'טרם נקבע';
            document.getElementById('detailUrgency').textContent = translatePriority(call.priority);
            
            // Update Progress Bar
            updateProgress(call.status);

            // Update Map & ETA
            if (tech && tech.lat && tech.lng && ['IN_ROUTE', 'ARRIVED'].includes(call.status)) {
                document.getElementById('mapContainer').classList.remove('hidden');
                document.getElementById('techInfo').textContent = `${tech.name} בדרך אליך`;
                
                if (!map) {
                    map = L.map('map').setView([tech.lat, tech.lng], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    
                    const techIcon = L.divIcon({
                        html: '<div class="text-3xl">🚗</div>',
                        className: 'custom-div-icon',
                        iconSize: [40, 40]
                    });
                    techMarker = L.marker([tech.lat, tech.lng], { icon: techIcon }).addTo(map);
                    
                    if (call.lat && call.lng) {
                        userMarker = L.marker([call.lat, call.lng]).addTo(map).bindPopup('המיקום שלך');
                        const group = new L.featureGroup([techMarker, userMarker]);
                        map.fitBounds(group.getBounds().pad(0.2));
                    }
                } else {
                    techMarker.setLatLng([tech.lat, tech.lng]);
                }

                // Simple ETA calculation for POC (assuming 30km/h)
                if (call.lat && call.lng) {
                    const dist = calculateDistance(tech.lat, tech.lng, call.lat, call.lng);
                    const mins = Math.round((dist / 30) * 60) + 5; // dist/speed * 60 + buffer
                    document.getElementById('etaText').textContent = `זמן הגעה משוער: ${mins} דקות`;
                }
            } else if (call.status === 'COMPLETED') {
                document.getElementById('statusIcon').textContent = '✅';
                document.getElementById('etaText').textContent = 'הטיפול הסתיים בהצלחה';
                document.getElementById('mapContainer').classList.add('hidden');
            } else {
                document.getElementById('statusIcon').textContent = '⏳';
                document.getElementById('etaText').textContent = 'ממתין לשיבוץ טכנאי...';
            }
        }

        function updateProgress(status) {
            const bar = document.getElementById('progressBar');
            const steps = [
                document.getElementById('step1'),
                document.getElementById('step2'),
                document.getElementById('step3'),
                document.getElementById('step4')
            ];

            steps.forEach(s => s.classList.replace('bg-blue-500', 'bg-slate-300'));

            if (status === 'NEW' || status === 'PENDING_ASSIGNMENT' || status === 'ASSIGNED') {
                bar.style.width = '0%';
                steps[0].classList.replace('bg-slate-300', 'bg-blue-500');
            } else if (status === 'IN_ROUTE') {
                bar.style.width = '33%';
                steps[0].classList.replace('bg-slate-300', 'bg-blue-500');
                steps[1].classList.replace('bg-slate-300', 'bg-blue-500');
            } else if (status === 'ARRIVED') {
                bar.style.width = '66%';
                steps[0].classList.replace('bg-slate-300', 'bg-blue-500');
                steps[1].classList.replace('bg-slate-300', 'bg-blue-500');
                steps[2].classList.replace('bg-slate-300', 'bg-blue-500');
            } else if (status === 'COMPLETED') {
                bar.style.width = '100%';
                steps.forEach(s => s.classList.replace('bg-slate-300', 'bg-blue-500'));
            }
        }

        function translatePriority(priority) {
            const map = {
                '1': 'חירום (דלת תקועה)',
                '2': 'דחוף מאוד',
                '3': 'דחוף',
                '4': 'רגיל'
            };
            return map[priority] || 'רגיל';
        }

        function translateStatus(status) {
            const map = {
                'NEW': 'הקריאה התקבלה',
                'PENDING_ASSIGNMENT': 'ממתין לשיבוץ',
                'ASSIGNED': 'טכנאי שובץ',
                'IN_ROUTE': 'הטכנאי בדרך',
                'ARRIVED': 'הטכנאי הגיע',
                'COMPLETED': 'הקריאה הושלמה'
            };
            return map[status] || status;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
    </script>
</body>
</html>
