<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פתיחת קריאת שירות - Garage CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap');
        body { font-family: 'Assistant', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">פתיחת קריאת שירות</h1>
        
        <form id="serviceCallForm" class="space-y-4" novalidate>
            <!-- Step 1: Details -->
            <div id="step1">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">שם פרטי</label>
                        <input type="text" name="first_name" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">שם משפחה</label>
                        <input type="text" name="last_name" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">טלפון</label>
                        <input type="tel" name="phone" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">אימייל</label>
                        <input type="email" name="email" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">סיווג דלת/שער</label>
                        <select name="door_class" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border" required>
                            <option value="Private">פרטי (Private)</option>
                            <option value="Commercial">מסחרי (Commercial)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">סוג המערכת</label>
                        <select name="door_type" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border" required>
                            <option value="Roll-up">רול אפ (Roll-up)</option>
                            <option value="Overhead">אובר הד (Overhead)</option>
                            <option value="Gate">שער (Gate)</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700">מהירות שירות מבוקשת</label>
                    <div class="mt-2 space-y-2 sm:space-y-0 sm:space-x-4 sm:space-x-reverse sm:flex">
                        <label class="inline-flex items-center">
                            <input type="radio" name="priority" value="4" class="text-blue-600" checked>
                            <span class="mr-2">לא דחוף</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="priority" value="3" class="text-yellow-600">
                            <span class="mr-2">בהקדם האפשרי (ASAP)</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="priority" value="1" class="text-red-600">
                            <span class="mr-2">חירום (Emergency)</span>
                        </label>
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700">כתובת מגורים</label>
                    <div class="flex mt-1">
                        <input type="text" name="address" id="address" class="block w-full border-gray-300 rounded-r-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border" placeholder="הזן כתובת או השתמש במיקום" required>
                        <button type="button" onclick="getLocation()" class="bg-blue-600 text-white px-3 py-2 rounded-l-md hover:bg-blue-700 transition">📍</button>
                    </div>
                    <input type="hidden" name="lat" id="lat">
                    <input type="hidden" name="lng" id="lng">
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700">תיאור התקלה</label>
                    <textarea name="notes" rows="3" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border" placeholder="פרט כאן על הבעיה..."></textarea>
                </div>

                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700">צילומי התקלה (אופציונלי)</label>
                    <input type="file" id="photos" multiple accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <button type="button" onclick="goToStep2()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-md hover:bg-blue-700 transition shadow-lg mt-6">המשך לבחירת מועד</button>
            </div>

            <!-- Step 2: Slot Selection -->
            <div id="step2" class="hidden">
                <h3 class="font-bold text-lg mb-4 text-gray-800">בחר מועד לביקור (חלונות של שעתיים)</h3>
                <div id="slotGrid" class="grid grid-cols-1 gap-3 max-h-64 overflow-y-auto p-1">
                    <!-- Slots will be injected here -->
                    <div class="text-center py-8 text-gray-500">טוען מועדים פנויים...</div>
                </div>
                <input type="hidden" name="scheduled_time" id="scheduled_time">
                
                <div class="flex space-x-4 space-x-reverse mt-6">
                    <button type="button" onclick="goToStep1()" class="w-1/3 bg-gray-200 text-gray-700 font-bold py-3 rounded-md hover:bg-gray-300 transition">חזור</button>
                    <button type="submit" id="submitBtn" disabled class="w-2/3 bg-green-600 text-white font-bold py-3 rounded-md hover:bg-green-700 transition shadow-lg disabled:opacity-50">שלח קריאה</button>
                </div>
            </div>
        </form>

        <div id="statusMessage" class="mt-4 p-3 rounded hidden text-center"></div>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api/action";

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    document.getElementById('lat').value = position.coords.latitude;
                    document.getElementById('lng').value = position.coords.longitude;
                    document.getElementById('address').value = "מיקום נוכחי נדגם";
                });
            } else {
                alert("Geolocation אינו נתמך בדפדפן זה.");
            }
        }

        function goToStep1() {
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('step2').classList.add('hidden');
        }

        async function goToStep2() {
            const form = document.getElementById('serviceCallForm');
            
            // Trigger native validation for Step 1 fields
            const step1Fields = document.querySelectorAll('#step1 input, #step1 select, #step1 textarea');
            let allValid = true;
            
            step1Fields.forEach(field => {
                if (!field.checkValidity()) {
                    field.reportValidity();
                    allValid = false;
                }
            });

            if (!allValid) return;

            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            
            fetchSlots();
        }

        async function fetchSlots() {
            const grid = document.getElementById('slotGrid');
            grid.innerHTML = '<div class="text-center py-8 text-gray-500">מחפש טכנאי פנוי...</div>';
            
            const lat = document.getElementById('lat').value;
            const lng = document.getElementById('lng').value;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'GET_AVAILABLE_SLOTS',
                        lat: lat ? parseFloat(lat) : null,
                        lng: lng ? parseFloat(lng) : null
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                if (result.status === "success" && result.slots && result.slots.length > 0) {
                    grid.innerHTML = '';
                    result.slots.forEach(slot => {
                        const btn = document.createElement('div');
                        btn.className = "border-2 border-gray-100 p-3 rounded-lg flex justify-between items-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition";
                        
                        const timeSpan = document.createElement('span');
                        timeSpan.className = "font-bold text-sm text-gray-700";
                        timeSpan.textContent = slot.label || slot.formatted;

                        const availSpan = document.createElement('span');
                        const availColor = slot.availability === 'גבוהה' ? 'text-green-600' : 'text-orange-500';
                        availSpan.className = `text-[10px] font-bold ${availColor}`;
                        availSpan.textContent = `זמינות: ${slot.availability || 'רגילה'}`;

                        btn.appendChild(timeSpan);
                        btn.appendChild(availSpan);
                        
                        btn.onclick = () => selectSlot(slot.id || slot.formatted, btn);
                        grid.appendChild(btn);
                    });
                } else {
                    grid.innerHTML = '<div class="text-center py-8 text-red-500">מצטערים, אין מועדים פנויים כרגע באזורך.</div>';
                }
            } catch (e) {
                console.error("Detailed Fetch Error:", e);
                grid.innerHTML = `<div class="text-center py-8 text-red-500">שגיאה בטעינת מועדים: ${e.message}</div>`;
            }
        }

        function selectSlot(formatted, element) {
            document.getElementById('scheduled_time').value = formatted;
            document.getElementById('submitBtn').disabled = false;
            
            // Highlight selected
            document.querySelectorAll('#slotGrid > div').forEach(el => el.classList.remove('border-blue-500', 'bg-blue-50'));
            element.classList.add('border-blue-500', 'bg-blue-50');
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('serviceCallForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = "שולח...";
            statusDiv.className = "mt-4 p-3 rounded text-center bg-blue-100 text-blue-700";
            statusDiv.classList.remove('hidden');

            // Handle photos
            const photoInput = document.getElementById('photos');
            if (photoInput.files.length > 0) {
                statusDiv.textContent = "מעבד תמונות...";
                data.photos = [];
                for (let i = 0; i < Math.min(photoInput.files.length, 3); i++) {
                    const base64 = await fileToBase64(photoInput.files[i]);
                    data.photos.push({
                        name: photoInput.files[i].name,
                        data: base64
                    });
                }
            }

            statusDiv.textContent = "שולח קריאה...";
            try {
                data.action = "CREATE_CALL";
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    statusDiv.textContent = "הקריאה נשלחה בהצלחה! מעביר למעקב...";
                    statusDiv.className = "mt-4 p-3 rounded text-center bg-green-100 text-green-700";
                    
                    // Redirect to tracking page after 2 seconds
                    setTimeout(() => {
                        window.location.href = `track.html?id=${result.callId}`;
                    }, 2000);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                statusDiv.textContent = "שגיאה: " + error.message;
                statusDiv.className = "mt-4 p-3 rounded text-center bg-red-100 text-red-700";
            }
        });
    </script>

</body>
</html>
